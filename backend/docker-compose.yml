version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fuelops-db
    environment:
      POSTGRES_USER: fuelops
      POSTGRES_PASSWORD: fuelopspassword
      POSTGRES_DB: fuelops_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
